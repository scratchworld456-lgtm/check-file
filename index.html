<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка безопасности</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #121212; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; user-select: none; text-align: center; }
        #bait { padding: 20px; cursor: pointer; }
        button { padding: 15px 35px; font-size: 18px; font-weight: bold; background: #0077ff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        #prank { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; background: #900000; padding: 20px; box-sizing: border-box; }
        #prank img { max-width: 85%; max-height: 45vh; border-radius: 12px; margin-bottom: 20px; border: 3px solid white; }
        h1 { font-size: 28px; margin: 10px 0; text-transform: uppercase; color: #ffeb3b; }
        #timer { font-size: 55px; font-weight: bold; color: white; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="bait" onclick="startPrank()">
        <h2>Файл готов к просмотру</h2>
        <p>Нажмите кнопку ниже, чтобы открыть</p>
        <button>Открыть</button>
    </div>

    <div id="prank">
        <img src="meme.jpg" onerror="this.style.display='none'">
        <h1>⚠️ ВНИМАНИЕ! ⚠️<br>ВАШ ТЕЛЕФОН ВЗОРВЕТСЯ ЧЕРЕЗ:</h1>
        <div id="timer">30</div>
    </div>

    <audio id="scream" src="sound.mp3" loop></audio>

    <script>
        function startPrank() {
            document.getElementById('bait').style.display = 'none';
            document.getElementById('prank').style.display = 'flex';
            
            const audio = document.getElementById('scream');
            audio.volume = 1.0;
            audio.play();
            
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            let timeLeft = 30;
            const timerEl = document.getElementById('timer');
            setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    timerEl.textContent = timeLeft;
                }
            }, 1000);
        }
    </script>
</body>
</html>
